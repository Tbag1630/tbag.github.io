<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* The editor's file: one card on the watch page's night-blue wall. Single dark look on purpose (it matches the
   screening page), every colour set explicitly. The file is rebuilt from byte parts and checked before saving. */
:root {
  --night: #0d1220;
  --wall: #151c30;
  --paper: #f3efe6;
  --muted: #a7adbf;
  --crayon: #f08a24;
  --teal: #4fc3b8;
  --bad: #ff8a7a;
  --line: #2a3350;
  --display: "Gaegu", "Comic Sans MS", "Chalkboard SE", cursive;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--night); color: var(--paper); }
body { font-family: var(--body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 760px; margin-inline: auto; display: grid; gap: 22px; }
header { display: grid; gap: 4px; }
.series { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 6vw, 60px); line-height: 1; margin: 0;
     color: var(--paper); text-wrap: balance; }
h1 span { color: var(--crayon); }
.card { background: var(--wall); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px;
        min-width: 0; }
.label { font: 700 13px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.name { font: 700 18px/1.3 var(--body); overflow-wrap: anywhere; }
.spec { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.spec b { color: var(--paper); font-weight: 700; }
.hash { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.hash code { font: 13px/1.4 var(--mono); color: var(--paper); overflow-wrap: anywhere; min-width: 0; flex: 1 1 260px; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
button { font: 700 15px/1 var(--body); color: var(--night); background: var(--crayon); border: 0; border-radius: 999px;
         padding: 12px 20px; cursor: pointer; }
button.quiet { background: transparent; color: var(--paper); border: 1px solid var(--line); padding: 8px 14px; font-size: 14px; }
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
button:disabled { opacity: .6; cursor: progress; }
#state { color: var(--muted); font-size: 14px; min-height: 1.4em; font-variant-numeric: tabular-nums; }
#state.bad { color: var(--bad); }
#state.good { color: var(--teal); }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--crayon); transition: width .2s; }
.note { max-width: 65ch; color: var(--muted); font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="series">__SERIES__</div>
    <h1>__HEADING__</h1>
  </header>

  <section class="card" aria-labelledby="fname">
    <div class="label">The editor's file</div>
    <div class="name" id="fname"></div>
    <div class="spec">__SPEC__</div>
    <div class="hash">
      <span class="label">SHA-256</span>
      <code id="sha"></code>
      <button class="quiet" id="copy" type="button">Copy</button>
    </div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <div class="row">
      <button id="dl" type="button">Download MP4</button>
      <span id="state" role="status" aria-live="polite"></span>
    </div>
  </section>

  <p class="note">__NOTE__</p>
</div>

<script>
const PARTS = __PARTS__;
const $ = (id) => document.getElementById(id);
$("fname").textContent = PARTS.filename;
$("sha").textContent = PARTS.sha256;

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(PARTS.sha256); $("copy").textContent = "Copied"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($("sha"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
});

function state(text, kind) { const s = $("state"); s.textContent = text; s.className = kind || ""; }
function hex(buf) { return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join(""); }

(async () => {
  const downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  const btn = $("dl");
  if (!downloads) {
    btn.disabled = true;
    state("Saving is not available in this view. Open this page in a browser to download the file.");
    return;
  }
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      const whole = new Uint8Array(PARTS.bytes);
      let at = 0;
      for (let i = 0; i < PARTS.parts.length; i++) {
        const r = await fetch(PARTS.parts[i]);
        if (!r.ok) throw { code: "fetch" };
        const b = new Uint8Array(await r.arrayBuffer());
        if (at + b.length > whole.length) throw { code: "size" };
        whole.set(b, at); at += b.length;
        $("fill").style.width = (100 * at / PARTS.bytes).toFixed(1) + "%";
        state("Fetching " + Math.round(100 * at / PARTS.bytes) + "%");
      }
      if (at !== PARTS.bytes) throw { code: "size" };
      state("Checking the file");
      const got = hex(await crypto.subtle.digest("SHA-256", whole));
      if (got !== PARTS.sha256) throw { code: "hash" };
      state("Checked. Choose where to save it.", "good");
      const res = await downloads.save({ filename: PARTS.filename, data: new Blob([whole], { type: "video/mp4" }) });
      state(res && res.status === "saved" ? "Handed to your browser. The file matches the SHA-256 above." : "", "good");
    } catch (e) {
      const code = e && e.code;
      state(code === "declined" ? "Download cancelled." :
            code === "too_large" ? "This app cannot save a file this size. Open this page in a browser." :
            code === "fetch" ? "A part of the file did not load. Nothing was saved; try again." :
            code === "size" || code === "hash" ? "The file did not rebuild exactly. Nothing was saved; reload and try again." :
            "Saving is not available here. Open this page in a browser.", code === "declined" ? "" : "bad");
    } finally { btn.disabled = false; }
  });
})();
</script>
